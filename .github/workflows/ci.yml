name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Core unit tests
        run: PYTHONPATH=packages/core/src python3 -m unittest discover -s packages/core/tests

      - name: MCP unit tests
        run: PYTHONPATH=packages/core/src:packages/mcp-server/src python3 -m unittest discover -s packages/mcp-server/tests

      - name: Top-level backend tests
        run: python3 -m unittest discover -s tests

      - name: Agent-pack validation
        run: python3 agent-pack/scripts/validate_agent_pack.py

      - name: Agent-pack cross-check tests
        run: PYTHONPATH=packages/core/src:packages/mcp-server/src python3 -m unittest discover -s agent-pack/tests

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: npm exec --yes pnpm@9 -- install --frozen-lockfile

      - name: Typecheck
        run: npm exec --yes pnpm@9 -- run check

      - name: Build
        run: npm exec --yes pnpm@9 -- run build
